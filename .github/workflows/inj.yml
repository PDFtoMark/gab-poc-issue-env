name: inj2
on:
  issues:
    types: [opened]
permissions:
  issues: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: show
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os
          for k in ("WEIRD","INJECTED","BASH_ENV","NODE_OPTIONS","PYTHONPATH","LD_PRELOAD","SLACK_WEBHOOK"):
              print(f"{k} -> {os.environ.get(k)!r}")
          print("BODY repr head:", repr(os.environ.get("BODY"))[:120])
          print("TITLE repr:", repr(os.environ.get("TITLE")))
          PY
          echo "marker-exists: $(test -e /tmp/pwned_marker && echo YES || echo NO)"
          echo "title-literal-check:"
          printf '%s\n' "$TITLE"
