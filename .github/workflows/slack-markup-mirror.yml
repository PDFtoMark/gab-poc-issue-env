name: slack-markup-mirror
on:
  issues:
    types: [opened]
permissions:
  issues: read
jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack payload exactly as pingidentity/identitycloud-go-client does
        env:
          SLACK_NOTIFY_TO_CDI_JIRA_WEBHOOK: https://hooks.slack.example/services/T000/B000/DUMMY
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_EVENT_ISSUE_HTML_URL: ${{ github.event.issue.html_url }}
        run: |
          python <<EOF
          import os
          import json
          import re
          headers = {'Content-Type': 'application/json'}
          message = {
              "text": f"New issue created in {os.environ['REPOSITORY_NAME']}: *{os.environ['ISSUE_TITLE']}*\n{os.environ['GITHUB_EVENT_ISSUE_HTML_URL']}",
              "REPOSITORY_NAME": os.environ['REPOSITORY_NAME'],
              "GITHUB_ISSUE": os.environ['GITHUB_EVENT_ISSUE_HTML_URL'],
              "ISSUE_TITLE": os.environ['ISSUE_TITLE']
          }
          print("SLACK_PAYLOAD_JSON_BEGIN")
          print(json.dumps(message))
          print("SLACK_PAYLOAD_JSON_END")
          print("RAW_TITLE_REPR:", repr(os.environ['ISSUE_TITLE']))
          def sanitize(text):
              return re.sub(r'[*_`~<>]', lambda m: '\\' + m.group(0), re.sub(r'<[^>]*>', '', text))
          print("PATCHED_TITLE_REPR:", repr(sanitize(os.environ['ISSUE_TITLE'])))
          print("PAYLOAD_LEN:", len(json.dumps(message)))
          EOF
